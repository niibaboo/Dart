<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Live Checkout</title><style>body{background:#050d24;color:#e8eefc;font-family:-apple-system;padding:14px;max-width:500px;margin:0 auto}h1{color:#ff9a2e}.box{background:#111e3d;border:1px solid #1e3260;border-radius:14px;padding:14px;margin:12px 0}.btn{background:#1a2c5e;color:#fff;border:1px solid #2a4a8e;border-radius:10px;padding:12px;margin:4px;font-size:16px;font-weight:800;width:22%}.big{font-size:42px;font-weight:900;color:#7dd3a8} input{background:#0d1733;border:1px solid #22366e;color:#fff;border-radius:10px;padding:10px;width:70px;font-size:18px;text-align:center}</style></head><body><h1>🎯 LIVE Tapper C</h1><div class='box'>Score: <input id='score' value='32' type='number'> Darts: <input id='darts' value='2' type='number'> Book%: <input id='book' value='57' type='number'></div><div class='box'><div>Model Checkout</div><div class='big' id='model'>71%</div><div>Edge: <span id='edge' style='font-size:28px;color:#ff9a2e;font-weight:900'>+14%</span> <span id='rec'></span></div></div><div class='box'><button class='btn' onclick='upd(32)'>32</button><button class='btn' onclick='upd(40)'>40</button><button class='btn' onclick='upd(16)'>16</button><button class='btn' onclick='upd(170)'>170</button></div><script>function calc(){let s=parseInt(document.getElementById('score').value)||32;let d=parseInt(document.getElementById('darts').value)||2;let pct=s<=40?0.68:s<=60?0.45:0.12;if(d==1)pct*=0.7;if(d==3)pct=Math.min(0.92,pct*1.15);document.getElementById('model').innerText=Math.round(pct*100)+'%';let b=parseInt(document.getElementById('book').value)||57;let e=Math.round(pct*100-b);document.getElementById('edge').innerText=(e>0?'+':'')+e+'%';document.getElementById('rec').innerText=e>8?'BET 🟢':e>3?'LEAN':'NO BET';}function upd(v){document.getElementById('score').value=v;calc();}document.getElementById('score').addEventListener('input',calc);document.getElementById('darts').addEventListener('input',calc);document.getElementById('book').addEventListener('input',calc);calc();</script></body></html>
